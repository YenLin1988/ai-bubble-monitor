name: Daily Early Warning & Entry Signals

on:
  schedule:
    # 22:00 UTC Mon-Fri = after the US close (17:00/18:00 New York). The Friday run also sends the weekly summary.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      status:
        description: 'Also send today''s status message'
        type: boolean
        default: false
      weekly:
        description: 'Also send the weekly summary'
        type: boolean
        default: false

# Needed to commit the forward-test log (data/signal_log.csv) back to the repository.
permissions:
  contents: write

concurrency:
  group: daily-signals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily signal check
        env:
          ALERTS_ENABLED: ${{ secrets.ALERTS_ENABLED }}
          ALERT_MIN_WARNING_LEVEL: ${{ vars.ALERT_MIN_WARNING_LEVEL }}
          ALERT_INDEX: ${{ vars.ALERT_INDEX }}
          ALERT_DISCORD_WEBHOOK_URL: ${{ secrets.ALERT_DISCORD_WEBHOOK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_EMAIL_SMTP_HOST: ${{ secrets.ALERT_EMAIL_SMTP_HOST }}
          ALERT_EMAIL_SMTP_PORT: ${{ secrets.ALERT_EMAIL_SMTP_PORT }}
          ALERT_EMAIL_USER: ${{ secrets.ALERT_EMAIL_USER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: >-
          python scripts/daily_alert.py
          ${{ inputs.status && '--status' || '' }}
          ${{ inputs.weekly && '--weekly' || '' }}

      - name: Save forward-test log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signal_log.csv
          if git diff --cached --quiet; then
            echo "Log unchanged"
          else
            git commit -m "Log daily signals $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
