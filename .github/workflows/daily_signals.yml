name: Daily Early Warning & Entry Signals

on:
  schedule:
    # 22:00 UTC Mon-Fri = after the US close (17:00/18:00 New York). The Friday run also sends the weekly summary.
    - cron: '0 22 * * 1-5'
    # Every 2 hours: only does work while data/pending_retry.json exists (a run had to use old data because a
    # provider was down). Once the data is back it sends one corrected report and clears the marker.
    - cron: '30 */2 * * *'
  workflow_dispatch:
    inputs:
      status:
        description: 'Also send today''s status message'
        type: boolean
        default: false
      weekly:
        description: 'Also send the weekly summary'
        type: boolean
        default: false

# Needed to commit the forward-test log and the retry marker back to the repository.
permissions:
  contents: write

concurrency:
  group: daily-signals
  cancel-in-progress: false

env:
  RETRY_RUN: ${{ github.event.schedule == '30 */2 * * *' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Retry runs stop here unless a previous run left a retry marker.
      - name: Anything to retry?
        id: gate
        run: |
          if [ "$RETRY_RUN" = "true" ] && [ ! -f data/pending_retry.json ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No pending retry."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      # Last successful downloads, used only as a fallback when a provider is down (e.g. FRED maintenance).
      - name: Restore last good data
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: data/backtest_cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      # Restored files look brand new; age them so every run still tries a fresh download first.
      - name: Mark restored data as old
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p data/backtest_cache
          find data/backtest_cache -type f -exec touch -d '2 days ago' {} +

      - name: Run daily signal check
        if: steps.gate.outputs.run == 'true'
        env:
          ALERTS_ENABLED: ${{ secrets.ALERTS_ENABLED }}
          ALERT_MIN_WARNING_LEVEL: ${{ vars.ALERT_MIN_WARNING_LEVEL }}
          ALERT_INDEX: ${{ vars.ALERT_INDEX }}
          ALERT_DISCORD_WEBHOOK_URL: ${{ secrets.ALERT_DISCORD_WEBHOOK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_EMAIL_SMTP_HOST: ${{ secrets.ALERT_EMAIL_SMTP_HOST }}
          ALERT_EMAIL_SMTP_PORT: ${{ secrets.ALERT_EMAIL_SMTP_PORT }}
          ALERT_EMAIL_USER: ${{ secrets.ALERT_EMAIL_USER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: >-
          python scripts/daily_alert.py
          ${{ env.RETRY_RUN == 'true' && '--retry' || '' }}
          ${{ inputs.status && '--status' || '' }}
          ${{ inputs.weekly && '--weekly' || '' }}

      # Runs even when the check failed, so a retry marker written before a failure is still saved.
      - name: Save forward-test log and retry marker
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "Nothing to save"
          else
            git commit -m "Log daily signals $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
